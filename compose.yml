services:
  app:
    build: .
    container_name: ronda-app
    ports:
      - "8080:80"
      - "443:443"
    volumes:
      - .:/app
    restart: unless-stopped
  
  css:
    profiles: ["css"]
    build:
      context: .
      target: css
    working_dir: /src
    command: tailwindcss -i resources/css/app.css -o public/css/app.css --watch=always
    volumes:
      - .:/src